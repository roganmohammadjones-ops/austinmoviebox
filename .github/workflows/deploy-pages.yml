name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export Web Application
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_WEB_BASE_PATH: /austinmoviebox
          EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY || 'd713b8b71e557bd1d18b9b230d0c4a7a' }}
          EXPO_PUBLIC_TMDB_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_ACCESS_TOKEN || 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJkNzEzYjhiNzFlNTU3YmQxZDE4YjliMjMwZDBjNGE3YSIsIm5iZiI6MTc5MTc3NzI1Ni4wOTQsInN1YiI6IjZhY2M1OWU4MTBhM2RiMDIwY2RlYWYwMyIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.CIEwkGKOqydyDcxCL4MXPV4crX2-KP5jIy-7JMFJEqk' }}
          EXPO_PUBLIC_TMDB_BASE_URL: https://api.themoviedb.org/3
          EXPO_PUBLIC_TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
          EXPO_PUBLIC_SUPABASE_URL: https://bvbhiqwaeycnhoqfkrpj.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2YmhpcXdhZXljbmhvcWZrcnBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNDgyMDAsImV4cCI6MjEwNjkyNDIwMH0.yI2ORTDDXSyRUH8z8eMmeIJ4eg0s4fcC9bSW5ePXmy8' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
